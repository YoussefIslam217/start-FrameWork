<section class="about-body  d-flex flex-column justify-content-center align-items-center ">
<h1 class="text-uppercase  pt-4 fw-bolder mb-3">portfolio component</h1>
<div class="d-flex flex-row align-items-center">
    <div class="line "></div>
    <div>
        <i class="fa-solid fa-star px-3"></i>
    </div>
    <div class="line "></div>
</div>
<div class="container py-4 ">
    <div class="row g-5">
        @for (src of imgSrc; track $index) {
            <div class="item col-12 col-md-6 col-lg-4 ">
                <div (click)="appearModel(src)" class="card position-relative position-relative">
                    <img [src]="src" class="w-100 rounded-3 card-img-top" alt="">
                    <div class="overlay position-absolute bottom-0 top-0 start-0 end-0 rounded-3 d-flex justify-content-center align-items-center ">
                        <i class="fa-solid fa-plus fa-6x text-white "></i>
                    </div>
                </div>
            </div>


        }
        <div 
        (click)="hideModel($event.target ,image )"
        [class.d-none]="isHidden"
        class="modall position-fixed top-0 bottom-0 end-0 start-0 bg-primary bg-opacity-25 d-flex justify-content-center align-items-center d-none">
            <img [src]="image" class="rounded-3" alt="">
        </div>
    </div>
</div>
</section>
